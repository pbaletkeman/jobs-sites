name: Format markdown

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/format-jobs.mjs'
      - '.github/workflows/format-markdown.yml'
  pull_request:
    paths:
      - '**.md'
      - 'scripts/format-jobs.mjs'
      - '.github/workflows/format-markdown.yml'

permissions:
  contents: write

concurrency:
  group: format-markdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Format jobs.md
        run: node scripts/format-jobs.mjs

      - name: Commit and push fixes
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if git diff --quiet; then
            echo "Markdown already formatted"
            exit 0
          fi
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::error::jobs.md is not formatted. Run: node scripts/format-jobs.mjs"
            git --no-pager diff
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.md
          git commit -m "style: format jobs.md [skip ci]"
          git push
